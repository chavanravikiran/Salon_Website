spring.application.name=salon-backend

# Which profile to run with. Override via env var SPRING_PROFILES_ACTIVE
# (e.g. SPRING_PROFILES_ACTIVE=prod) - env vars take precedence over this default.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:9209}

# --- Settings shared by every profile ---

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.notifications.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.notifications.whatsapp.appointment-template-name=${WHATSAPP_TEMPLATE_NAME:appointment_confirmation}
