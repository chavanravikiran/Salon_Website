spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

app.storage.type=s3
app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.region=${AWS_REGION:us-east-1}
# Optional: set to a CloudFront domain (e.g. https://cdn.radiancesalon.com) to serve uploads through a CDN
# instead of direct S3 URLs. Leave blank to use the bucket's own https://<bucket>.s3.<region>.amazonaws.com URL.
app.aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.admin.default-username=${ADMIN_DEFAULT_USERNAME}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}

app.notifications.email.enabled=${NOTIFY_EMAIL_ENABLED:false}
app.notifications.email.from=${NOTIFY_EMAIL_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.notifications.whatsapp.enabled=${NOTIFY_WHATSAPP_ENABLED:false}
app.notifications.whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
app.notifications.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.notifications.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.notifications.whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:91}
